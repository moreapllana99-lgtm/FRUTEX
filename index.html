<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutex Flavor Lab</title>
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<div id="game-root">
  <!-- HUD -->
  <div id="game-hud">
    <span class="hud-brand">Frutex Flavor Lab</span>
    <div class="hud-stat"><span class="hud-icon"><svg viewBox="0 0 20 20" width="16" height="16"><defs><linearGradient id="coinG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0d060"/><stop offset="50%" stop-color="#d4a840"/><stop offset="100%" stop-color="#8a6d20"/></linearGradient></defs><circle cx="10" cy="10" r="9" fill="url(#coinG)" stroke="#6b5328" stroke-width="0.8"/><circle cx="10" cy="10" r="6.5" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="0.5"/><text x="10" y="14" text-anchor="middle" fill="#5a4020" font-size="9" font-weight="800" font-family="'Cinzel',serif">$</text></svg></span><span class="hud-value" id="hud-coins">0</span><span class="hud-label">coins</span></div>
    <div class="hud-stat"><span class="hud-icon"><svg viewBox="0 0 20 20" width="16" height="16"><defs><linearGradient id="drinkG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d4b06a"/><stop offset="100%" stop-color="#8a6d3b"/></linearGradient></defs><path d="M7 2 L7 10 Q4 12.5 4 15.5 Q4 17 5 17.5 L15 17.5 Q16 17 16 15.5 Q16 12.5 13 10 L13 2" fill="url(#drinkG)" stroke="#6b5328" stroke-width="0.6" stroke-linejoin="round"/><ellipse cx="10" cy="13" rx="3.5" ry="2" fill="rgba(255,255,255,0.12)"/></svg></span><span class="hud-value" id="hud-drinks">0</span><span class="hud-label">created</span></div>
    <div class="hud-stat"><span class="hud-icon"><svg viewBox="0 0 20 20" width="16" height="16"><defs><linearGradient id="bookG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c8a45c"/><stop offset="100%" stop-color="#8a6d3b"/></linearGradient></defs><rect x="4" y="2.5" rx="1.2" width="12" height="15" fill="url(#bookG)" stroke="#6b5328" stroke-width="0.6"/><line x1="10" y1="2.5" x2="10" y2="17.5" stroke="rgba(0,0,0,0.2)" stroke-width="0.6"/><rect x="5.5" y="5" width="3.5" height="1" rx="0.3" fill="rgba(255,255,255,0.2)"/><rect x="5.5" y="8" width="3.5" height="1" rx="0.3" fill="rgba(255,255,255,0.15)"/><rect x="11" y="5" width="3.5" height="1" rx="0.3" fill="rgba(255,255,255,0.2)"/><rect x="11" y="8" width="3.5" height="1" rx="0.3" fill="rgba(255,255,255,0.15)"/></svg></span><span class="hud-value" id="hud-discovered">0</span><span class="hud-label">found</span></div>
  </div>

  <!-- NAV -->
  <nav id="game-nav">
    <button class="nav-tab active" data-goto="menu">Menu</button>
    <button class="nav-tab" data-goto="lab">Laboratory</button>
    <button class="nav-tab eagle-tab" data-goto="eagle">Golden Eagle</button>
    <button class="nav-tab" data-goto="daily">Daily</button>
    <button class="nav-tab" data-goto="collection">Collection</button>
    <button class="nav-tab" data-goto="achievements">Achievements</button>
    <button class="nav-tab" data-goto="minigames">Mini Games</button>
    <button class="nav-tab" data-goto="leaderboard">Scores</button>
    <button class="nav-tab" data-goto="settings">Settings</button>
    <button class="nav-tab" data-goto="credits">Credits</button>
  </nav>

  <!-- MENU -->
  <section class="screen active" data-screen="menu" id="menu-screen">
    <div class="menu-title-area">
      <div class="menu-logo"><svg viewBox="0 0 48 48" width="48" height="48"><defs><linearGradient id="logoFl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0d878"/><stop offset="40%" stop-color="#d4a840"/><stop offset="100%" stop-color="#8a6d20"/></linearGradient><linearGradient id="logoLiq" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff6b35"/><stop offset="100%" stop-color="#c0392b"/></linearGradient></defs><path d="M16 6 L16 24 Q12 28 12 34 Q12 38 14 40 L34 40 Q36 38 36 34 Q36 28 32 24 L32 6" fill="url(#logoFl)" stroke="#5a4020" stroke-width="1.2" stroke-linejoin="round"/><ellipse cx="24" cy="28" rx="7" ry="4" fill="url(#logoLiq)" opacity="0.6"/><ellipse cx="22" cy="24" rx="5" ry="2.5" fill="rgba(255,255,255,0.15)"/><circle cx="30" cy="16" r="3" fill="rgba(255,255,255,0.08)"/><circle cx="28" cy="20" r="1.5" fill="rgba(255,255,255,0.06)"/></svg></div>
      <h1 class="menu-title">Frutex Flavor Lab</h1>
      <p class="menu-subtitle">Beverage Innovation Laboratory</p>
    </div>
    <div class="menu-buttons">
      <button class="menu-btn primary" data-goto="lab"><span class="btn-icon"><svg viewBox="0 0 24 24" width="20" height="20"><defs><linearGradient id="labFlask" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0d878"/><stop offset="100%" stop-color="#b8943e"/></linearGradient></defs><path d="M8 3 L8 14 Q5 17 5 20 Q5 21.5 6 22 L18 22 Q19 21.5 19 20 Q19 17 16 14 L16 3" fill="url(#labFlask)" stroke="#5a4020" stroke-width="1" stroke-linejoin="round"/><ellipse cx="12" cy="17" rx="4" ry="2.5" fill="rgba(255,255,255,0.15)"/><rect x="11" y="1" width="2" height="4" rx="0.5" fill="#b8943e"/></svg></span>Enter Laboratory<span class="btn-arrow">→</span></button>
      <button class="menu-btn" data-goto="collection"><span class="btn-icon"><svg viewBox="0 0 24 24" width="20" height="20"><defs><linearGradient id="collBook" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d4b06a"/><stop offset="100%" stop-color="#8a6d3b"/></linearGradient></defs><rect x="4" y="2" rx="1.5" width="16" height="20" fill="url(#collBook)" stroke="#5a4020" stroke-width="0.8"/><line x1="12" y1="2" x2="12" y2="22" stroke="rgba(0,0,0,0.15)" stroke-width="0.8"/><rect x="6" y="7" width="5" height="1.5" rx="0.5" fill="rgba(255,255,255,0.2)"/><rect x="6" y="11" width="5" height="1.5" rx="0.5" fill="rgba(255,255,255,0.15)"/><rect x="6" y="15" width="5" height="1.5" rx="0.5" fill="rgba(255,255,255,0.12)"/><rect x="13" y="7" width="5" height="1.5" rx="0.5" fill="rgba(255,255,255,0.18)"/></svg></span>Recipe Collection<span class="btn-arrow">→</span></button>
      <button class="menu-btn eagle" data-goto="eagle"><span class="btn-icon"><svg viewBox="0 0 24 24" width="20" height="20"><defs><linearGradient id="eagleIco" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f0d060"/><stop offset="100%" stop-color="#b89420"/></linearGradient></defs><path d="M12 2 L12 12 M12 2 Q6 5 4 10 Q3 12 4 13 L8 11 Q9 10 10 8 L12 12 L14 8 Q15 10 16 11 L20 13 Q21 12 20 10 Q18 5 12 2Z" fill="url(#eagleIco)" stroke="#5a4010" stroke-width="0.6" stroke-linejoin="round"/><path d="M7 15 L12 20 L17 15" stroke="#d4a840" stroke-width="1.2" fill="none" stroke-linecap="round"/><line x1="12" y1="13" x2="12" y2="20" stroke="#d4a840" stroke-width="0.8"/></svg></span>Golden Eagle Division<span class="btn-arrow">→</span></button>
      <button class="menu-btn" data-goto="achievements"><span class="btn-icon"><svg viewBox="0 0 24 24" width="20" height="20"><defs><linearGradient id="trophyIco" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0d878"/><stop offset="100%" stop-color="#b8943e"/></linearGradient></defs><path d="M6 4 L6 10 Q6 13 9 14 L9 18 L6 20 L6 21 L18 21 L18 20 L15 18 L15 14 Q18 13 18 10 L18 4Z" fill="url(#trophyIco)" stroke="#5a4020" stroke-width="0.6" stroke-linejoin="round"/><rect x="6" y="21" rx="0.5" width="12" height="2" fill="#b8943e"/><path d="M4 7 Q2 7 2 10 Q2 12 4 13" fill="none" stroke="#d4b06a" stroke-width="1.2" stroke-linecap="round"/><path d="M20 7 Q22 7 22 10 Q22 12 20 13" fill="none" stroke="#d4b06a" stroke-width="1.2" stroke-linecap="round"/></svg></span>Achievements<span class="btn-arrow">→</span></button>
      <button class="menu-btn" data-goto="settings"><span class="btn-icon"><svg viewBox="0 0 24 24" width="20" height="20"><defs><linearGradient id="gearIco" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c8a45c"/><stop offset="100%" stop-color="#8a6d3b"/></linearGradient></defs><circle cx="12" cy="12" r="3.5" fill="#1a1410" stroke="url(#gearIco)" stroke-width="1.5"/><path d="M12 2 L12 6 M12 18 L12 22 M2 12 L6 12 M18 12 L22 12 M5 5 L7.5 7.5 M16.5 16.5 L19 19 M5 19 L7.5 16.5 M16.5 7.5 L19 5" stroke="#8a6d3b" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="1.8" fill="#d4b06a"/></svg></span>Settings<span class="btn-arrow">→</span></button>
    </div>
  </section>

  <!-- LABORATORY -->
  <section class="screen" data-screen="lab" id="lab-screen">
    <div class="lab-layout" id="lab-layout">
      <!-- LEFT: Ingredients -->
      <div class="lab-left">
        <div class="game-panel" style="flex:1">
          <div class="panel-header">Ingredient Shelf</div>
          <div class="panel-body ingredient-shelf" id="ingredient-shelf"></div>
        </div>
      </div>
      <!-- CENTER: Mixing Station + Buttons -->
      <div class="lab-center">
        <div class="game-panel">
          <div class="panel-header">Mixing Station</div>
          <div class="mixing-station" id="mixing-station">
            <div class="mixing-machine" id="mixing-machine">
              <div class="machine-glass" id="machine-glass">
                <div class="glass-liquid" id="glass-liquid"></div>
                <svg viewBox="0 0 48 48" width="36" height="36"><defs><linearGradient id="machG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0d878"/><stop offset="50%" stop-color="#d4a840"/><stop offset="100%" stop-color="#8a6d20"/></linearGradient><linearGradient id="machLiq" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff6b35"/><stop offset="100%" stop-color="#c0392b"/></linearGradient></defs><path d="M14 8 L14 26 Q10 30 10 36 Q10 40 12 42 L36 42 Q38 40 38 36 Q38 30 34 26 L34 8" fill="url(#machG)" stroke="#5a4020" stroke-width="1.2" stroke-linejoin="round"/><ellipse cx="24" cy="32" rx="8" ry="5" fill="url(#machLiq)" opacity="0.5"/><ellipse cx="22" cy="26" rx="6" ry="3" fill="rgba(255,255,255,0.12)"/><circle cx="29" cy="16" r="3" fill="rgba(255,255,255,0.06)"/><circle cx="27" cy="21" r="1.5" fill="rgba(255,255,255,0.05)"/><rect x="22" y="3" width="4" height="6" rx="1" fill="#b8943e"/></svg>
              </div>
              <div class="machine-label">FruteX 3000</div>
            </div>
            <div class="ingredient-slots" id="ingredient-slots">
              <div class="ingredient-slot empty"><span class="slot-placeholder">+</span></div>
              <div class="ingredient-slot empty"><span class="slot-placeholder">+</span></div>
              <div class="ingredient-slot empty"><span class="slot-placeholder">+</span></div>
            </div>
            <!-- Wooden Bar Buttons -->
            <div class="button-bar">
              <button class="bar-btn pour-btn" id="btn-clear" title="Clear ingredients">
                <span class="bar-btn-icon">🍾</span>POUR
              </button>
              <button class="bar-btn shake-btn" id="btn-mix" disabled title="Mix your drink">
                <span class="bar-btn-icon">🥤</span>SHAKE
              </button>
              <button class="bar-btn serve-btn" id="btn-serve" title="Serve to customer">
                <span class="bar-btn-icon">🍸</span>SERVE
              </button>
            </div>
          </div>
        </div>
        <div class="result-panel" id="result-panel"></div>
      </div>
      <!-- RIGHT: Bartender + Orders -->
      <div class="lab-right">
        <!-- Customer Orders (parchment) -->
        <div class="game-panel" style="flex:1">
          <div class="panel-header">Customer Orders</div>
          <div class="panel-body order-panel" id="customer-panel"></div>
        </div>
        <!-- Bartender Character -->
        <div class="game-panel">
          <div class="panel-header">Your Bartender</div>
          <div class="panel-body" style="text-align:center;padding:12px 12px 0">
            <div class="bartender" id="bartender">
              <div class="bartender-head" id="b-head">
                <div class="bartender-eyes">
                  <div class="bartender-eye"></div>
                  <div class="bartender-eye"></div>
                </div>
                <div class="bartender-mouth"></div>
              </div>
              <div class="bartender-body">
                <div class="bartender-bowtie"></div>
              </div>
              <div class="bartender-arm left" id="b-arm-l">
                <div class="bartender-hand" id="b-hand-l"></div>
              </div>
              <div class="bartender-arm right" id="b-arm-r">
                <div class="bartender-hand shaker-hold" id="b-hand-r"></div>
              </div>
            </div>
            <!-- Wooden shelf behind bartender -->
            <div class="wooden-shelf" style="margin-top:8px;border-radius:0 0 var(--radius-lg) var(--radius-lg)">
              <div class="shelf-bottle" style="background:linear-gradient(180deg,#ff5252,#b71c1c)"></div>
              <div class="shelf-bottle" style="background:linear-gradient(180deg,#ffb74d,#e65100)"></div>
              <div class="shelf-bottle" style="background:linear-gradient(180deg,#fff176,#f9a825)"></div>
              <div class="shelf-jar" style="background:linear-gradient(180deg,rgba(129,199,132,0.7),#388e3c)"></div>
              <div class="shelf-bottle" style="background:linear-gradient(180deg,#ce93d8,#7b1fa2)"></div>
              <div class="shelf-bottle" style="background:linear-gradient(180deg,#4fc3f7,#0277bd)"></div>
              <div class="shelf-bottle" style="background:linear-gradient(180deg,#ff8a65,#bf360c)"></div>
              <div class="shelf-jar" style="background:linear-gradient(180deg,rgba(255,183,77,0.7),#ff8f00)"></div>
              <div class="shelf-bottle" style="background:linear-gradient(180deg,#a5d6a7,#2e7d32)"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- GOLDEN EAGLE -->
  <section class="screen" data-screen="eagle" id="eagle-screen">
    <div class="eagle-layout" id="eagle-layout"></div>
  </section>

  <!-- DAILY -->
  <section class="screen" data-screen="daily" id="daily-screen"></section>

  <!-- COLLECTION -->
  <section class="screen" data-screen="collection" id="collection-screen"></section>

  <!-- ACHIEVEMENTS -->
  <section class="screen" data-screen="achievements" id="achievements-screen"></section>

  <!-- MINI GAMES -->
  <section class="screen" data-screen="minigames" id="minigames-screen"></section>

  <!-- LEADERBOARD -->
  <section class="screen" data-screen="leaderboard" id="leaderboard-screen"></section>

  <!-- SETTINGS -->
  <section class="screen" data-screen="settings" id="settings-screen"></section>

  <!-- CREDITS -->
  <section class="screen" data-screen="credits" id="credits-screen"></section>
</div>

<canvas id="particles-canvas"></canvas>
<div id="overlay-bg"></div>
<div class="game-modal" id="generic-modal"><h2 class="modal-title"></h2><div class="modal-body"></div><div class="modal-buttons"></div></div>
<div id="toast-container"></div>

<script src="js/game.js"></script>
</body>
</html>
